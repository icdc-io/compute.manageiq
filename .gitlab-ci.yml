image: "ahrechushkin/ruby-postgresql"

variables:
  POSTGRES_DB: vmdb_test
  POSTGRES_USER: postgres
  #POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  GIT_CRED: os-deploy:${CI_JOB_TOKEN}@git.zby.icdc.io
  RAILS_ENV: test
  RUBY_GC_HEAP_GROWTH_MAX_SLOTS: 300000
  RUBY_GC_HEAP_INIT_SLOTS: 600000
  RUBY_GC_HEAP_GROWTH_FACTOR: '1.25'
  PARALLEL_TEST_PROCESSORS: 2

services:
  - postgres
  
before_script:
  - bundle update && bundle install 

stages:
  - rubocop

rubocop:
  stage: rubocop
  tags: [icdc_j]
  script:
    - gem install rubocop
    - (git diff HEAD --name-only --diff-filter=MA  & git diff HEAD~1 --name-only --diff-filter=MA;) | sort | uniq | sed -e '/Gemfile/d' -e '/gitlab-ci/d' -e 'rubocop' | xargs rubocop

